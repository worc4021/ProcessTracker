name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build ProcessTracker.slnx -c Release -warnaserror
      - name: Test
        run: dotnet test --solution ProcessTracker.slnx -c Release --no-build -- --filter-not-trait "Category=Perf"
