name: release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish (for example v0.1.0).
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rebuild and republish (for example v0.1.0).
        required: true
        type: string

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Resolve version
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Tag '$env:TAG' must look like v<major>.<minor>.<patch>." }
          $version = (Get-Content -LiteralPath version.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "version.txt must hold X.Y.Z (got '$version')." }
          if ($env:TAG -ne "v$version") { throw "Tag '$env:TAG' does not match version.txt ($version)." }
          "VERSION=$version" >> $env:GITHUB_ENV
          "MSI=artifacts\ProcessTracker-$version-x64.msi" >> $env:GITHUB_ENV
          "ZIP=artifacts\ProcessTracker-$version-x64.zip" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test --solution ProcessTracker.slnx -c Release -- --filter-not-trait "Category=Perf"

      - name: Build MSI and zip
        run: |
          ./scripts/build-msi.ps1 -Configuration Release -OutDir artifacts
          if ($LASTEXITCODE -ne 0) { throw 'build-msi.ps1 failed.' }
          if (-not (Test-Path -LiteralPath $env:MSI)) { throw "Expected $env:MSI was not produced." }
          if (-not (Test-Path -LiteralPath $env:ZIP)) { throw "Expected $env:ZIP was not produced." }

      # Before the MSI smoke test: user mode exits at start while the machine service is installed.
      - name: User-mode smoke test
        run: ./scripts/user-smoke.ps1 -Zip $env:ZIP

      # The same MSI rebuilt with a dev suffix is the upgrade candidate. It goes to its own folder so the
      # release stage and MSI stay untouched.
      - name: Build smoke upgrade MSI
        run: |
          ./scripts/build-msi.ps1 -Configuration Release -DevSuffix smoke -OutDir artifacts-smoke
          if ($LASTEXITCODE -ne 0) { throw 'build-msi.ps1 (smoke) failed.' }

      - name: MSI smoke test
        run: ./scripts/msi-smoke.ps1 -Msi $env:MSI -UpgradeMsi "artifacts-smoke\ProcessTracker-$env:VERSION-x64.msi" -LogDir "$env:RUNNER_TEMP\msi-smoke"

      # build-msi.ps1 republishes (and wipes) the stage, so the signed stage is packaged again with -SkipPublish:
      # the MSI and the zip then both carry the signed binaries.
      - name: Sign binaries
        if: vars.SIGNING_ENABLED == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\artifacts\stage\ProcessTracker.Service.exe
            ${{ github.workspace }}\artifacts\stage\bin\proctrack.exe

      - name: Rebuild MSI and zip from signed binaries
        if: vars.SIGNING_ENABLED == 'true'
        run: |
          ./scripts/build-msi.ps1 -Configuration Release -OutDir artifacts -SkipPublish
          if ($LASTEXITCODE -ne 0) { throw 'build-msi.ps1 -SkipPublish failed.' }

      - name: Sign MSI
        if: vars.SIGNING_ENABLED == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\artifacts\ProcessTracker-${{ env.VERSION }}-x64.msi

      - name: Write SHA256SUMS.txt
        run: |
          # One "<hex>  <name>" line per asset, the MSI first.
          $lines = foreach ($asset in $env:MSI, $env:ZIP) {
            $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path -Leaf $asset)`n"
          }
          [IO.File]::WriteAllText((Join-Path $PWD 'SHA256SUMS.txt'), (-join $lines), [Text.UTF8Encoding]::new($false))
          Get-Content -LiteralPath SHA256SUMS.txt

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:TAG $env:MSI $env:ZIP SHA256SUMS.txt --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'gh release upload failed.' }

      - name: Submit to winget
        if: vars.WINGET_PUBLISHED == 'true'
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          WINGETCREATE_SHA256: 63d980ba79e97042395bd6eb5992c2db9e01e9e7a8a22958a95c288f27310413
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'wingetcreate.exe'
          Invoke-WebRequest -Uri 'https://github.com/microsoft/winget-create/releases/download/v1.28.1.0/wingetcreate.exe' -OutFile $exe
          $actual = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          if ($actual -ne $env:WINGETCREATE_SHA256.ToUpperInvariant()) { throw "wingetcreate.exe SHA256 mismatch (got $actual)." }
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/ProcessTracker-$env:VERSION-x64.msi|x64"
          & $exe update worc4021.ProcessTracker --version $env:VERSION --urls $url --submit --token $env:WINGET_TOKEN
          if ($LASTEXITCODE -ne 0) { throw 'wingetcreate update failed.' }

      - name: Note skipped winget step
        if: vars.WINGET_PUBLISHED != 'true'
        run: |
          $msg = 'winget step skipped (WINGET_PUBLISHED is not true)'
          Write-Host "::notice::$msg"
          "::notice::$msg" >> $env:GITHUB_STEP_SUMMARY

      # The plugin marketplace on main installs the plugin from a tag: point it, and plugin.json, at this release.
      # A rebuild of an older tag leaves a newer pointer alone.
      - name: Check out main for the marketplace bump
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          path: marketplace-bump

      - name: Point the plugin marketplace at the tag
        working-directory: marketplace-bump
        run: |
          $marketplace = '.claude-plugin/marketplace.json'
          $manifest = 'plugin/.claude-plugin/plugin.json'
          $current = [string](Get-Content -LiteralPath $marketplace -Raw | ConvertFrom-Json).plugins[0].source.ref
          if ($current -match '^v(\d+\.\d+\.\d+)$' -and [version]$Matches[1] -gt [version]$env:VERSION) {
            Write-Host "::notice::The plugin marketplace points at $current, newer than $env:TAG; left alone."
            exit 0
          }

          # Replaces the one "<key>": "<string>" in place, so the rest of the file stays as it is.
          function Set-JsonString([string]$Path, [string]$Key, [string]$Value) {
            $full = Join-Path $PWD $Path
            $text = [IO.File]::ReadAllText($full)
            $pattern = '("' + $Key + '"\s*:\s*")[^"]*(")'
            $count = [regex]::Matches($text, $pattern).Count
            if ($count -ne 1) { throw "$Path must hold exactly one `"$Key`" string (found $count)." }
            [IO.File]::WriteAllText($full, [regex]::Replace($text, $pattern, "`${1}$Value`${2}"), [Text.UTF8Encoding]::new($false))
          }
          Set-JsonString $marketplace 'ref' $env:TAG
          Set-JsonString $manifest 'version' $env:VERSION
          $ref = (Get-Content -LiteralPath $marketplace -Raw | ConvertFrom-Json).plugins[0].source.ref
          $version = (Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json).version
          if ($ref -ne $env:TAG -or $version -ne $env:VERSION) { throw "The bump left ref '$ref' and version '$version'." }

          git diff --quiet -- $marketplace $manifest
          if ($LASTEXITCODE -eq 0) {
            Write-Host "The plugin marketplace already points at $env:TAG; nothing to commit."
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet -m "chore: point the plugin marketplace at $env:TAG" -- $marketplace $manifest
          if ($LASTEXITCODE -ne 0) { throw 'git commit failed.' }
          $push = git push origin HEAD:main 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $push
          if ($code -ne 0) {
            # Branch protection or a ruleset turned the workflow token away.
            if ($push -match 'protected branch|GH006|GH013|denied|403') {
              Write-Host '::error::allow github-actions to push marketplace bumps to main'
              throw 'allow github-actions to push marketplace bumps to main'
            }
            throw "git push failed with exit code $code."
          }
